name: ShadowBallot Production Build & Deployment

on:
  push:
    branches: [ Main, main ]

jobs:
  deploy:
    name: Build & Validate Distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build

      - name: Verify Bundle Integrity
        run: |
          test -f dist/index.html && echo "dist/index.html exists"
          ls -la dist/assets/
